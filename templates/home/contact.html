{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <h1 class="mb-4"> للتواصل معنا</h1>
        <div class="card shadow-sm">
            <div class="card-body p-5">
                <h3 class="text-center mb-4">تواصل معنا</h3>
                <p class="text-center text-muted mb-5">
للاستفسار عن مجلاتنا أو مؤتمراتنا أو برامجنا التدريبية
                </p>
                
                <div class="row mb-5">
                    <div class="col-md-6 text-center mb-4">
                        <i class="fas fa-envelope fa-2x text-primary mb-3"></i>
                        <h5>Email</h5>
                        <a href="mailto:{{ organization.email }}">{{ organization.email }}</a>


                    </div>
                    <div class="col-md-6 text-center mb-4">
                        <i class="fas fa-phone fa-2x text-primary mb-3"></i>
                        <h5>Phone</h5>
                        <p class="text-muted">{{ organization.phone|default:"+20 115 693 9552" }}</p>
                    </div>
                </div>
                
                <p class="text-center">
                    <strong>Note:</strong> Contact form functionality will be implemented soon.
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
